name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Reads the pinned version from package.json#packageManager
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Runs the same entry point a contributor runs locally, so a broken
      # root script cannot ship green.
      - name: Verify
        run: pnpm verify

      # Architectural guardrails are checked inside `pnpm verify`; this step
      # exists to surface the boundary graph separately when it fails.
      - name: Architecture boundaries
        if: failure()
        run: pnpm arch

      # Playwright E2E, axe and visual regression join this workflow when the
      # first route and section land (roadmap WP16, CLAUDE.md §13).
