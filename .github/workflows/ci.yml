name: CI

on:
  push:
    # claude/** covers agent working branches: a push with no PR still runs
    # the full pipeline, so "did the push break anything" has a real answer.
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # CI-only database: migrations and the demo seed run against a throwaway
  # Postgres service, so the adapter contract test and the prerender build
  # exercise the real Local API instead of skipping. Nothing here touches
  # Supabase — production migrations remain a separate, approved step (§4).
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/courvia_ci
  PAYLOAD_SECRET: ci-only-secret-never-production
  # The fourth layer of .claude/rules/database.md only counts if it RUNS.
  # data-api-exposure.test.ts skipped itself on every run so far because
  # these two were never set, and a suite that skips reports the same green
  # as a suite that passed. Both values are public by design — the
  # publishable key is the one Supabase ships to browsers, and it grants
  # exactly what RLS allows, which for the `payload` schema is nothing. The
  # secret that must never appear here is SUPABASE_SECRET_KEY.
  # Repository VARIABLES (not secrets: masking a value that ships to every
  # browser buys nothing) with the current values as fallback, so rotating
  # the key is a settings change instead of a pull request, and a fork with
  # no variables configured still runs the proof.
  SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://xurdwzbefgxpfzgkbbkf.supabase.co' }}
  SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_S7WYO1rf0UK117XCrzYU0A_EZfmJ_71' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # Matches production (Supabase Postgres 17)
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: courvia_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # Reads the pinned version from package.json#packageManager
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Migrate CI database
        run: pnpm --filter @courvia/web migrate

      # The RLS invariant, asserted against CI's OWN Postgres — no network,
      # no Supabase. The migration says it locks the schema down; this proves
      # the schema CI just built is actually locked. Until 20 Aug 2026 RLS
      # existed only as manual state in one project, so every rebuilt
      # database came up unprotected and nothing said a word.
      - name: Row Level Security invariant
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "
            DO \$\$
            DECLARE unprotected int; policies int;
            BEGIN
              SELECT count(*) INTO unprotected FROM pg_tables
                WHERE schemaname = 'payload' AND NOT rowsecurity;
              SELECT count(*) INTO policies FROM pg_policies
                WHERE schemaname = 'payload';
              IF unprotected <> 0 THEN
                RAISE EXCEPTION '% table(s) in payload have RLS disabled', unprotected;
              END IF;
              IF policies <> 0 THEN
                RAISE EXCEPTION 'payload has % polic(ies); deny-all expects none', policies;
              END IF;
              RAISE NOTICE 'RLS invariant holds across the payload schema';
            END \$\$;"

      # Same entry point as local bootstrap (catalog → markets → content):
      # one place defines the seeding order.
      - name: Seed demo data
        run: pnpm seed

      # Runs the same entry point a contributor runs locally, so a broken
      # root script cannot ship green.
      - name: Verify
        run: pnpm verify

      # Architectural guardrails are checked inside `pnpm verify`; this step
      # exists to surface the boundary graph separately when it fails.
      - name: Architecture boundaries
        if: failure()
        run: pnpm arch

  # ---------------------------------------------------------------------------
  # El navegador (WP16 · Fase 8). Job SEPARADO de `verify`, y a propósito:
  # `verify` ya tarda unos cuatro minutos y mezclar las dos cosas hace que un
  # fallo de layout se lea como un fallo de tipos. Aquí se levanta el mismo
  # Postgres, se migra, se siembra y se sirve el build — porque estas pruebas
  # miden la PÁGINA, y una página sin catálogo no tiene raíl que medir.
  # ---------------------------------------------------------------------------
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: courvia_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Solo Chromium: las tres carencias que este harness cierra —geometría,
      # desbordamiento y árbol de accesibilidad— no dependen del motor, y tres
      # navegadores triplicarían el tiempo a cambio de nada que hoy se afirme.
      - name: Install Chromium
        run: pnpm --filter @courvia/web exec playwright install --with-deps chromium

      - name: Migrate CI database
        run: pnpm --filter @courvia/web migrate

      - name: Seed demo data
        run: pnpm seed

      # `playwright.config.ts` sirve el build con `next start`; sin build no
      # hay nada que servir.
      #
      # POR TURBO, no `pnpm --filter @courvia/web build`. Eso último construye
      # SOLO la app, y `@courvia/design-tokens` y `@courvia/appearance`
      # GENERAN css (`dist/tokens.css`, `dist/appearance.css`, los dos
      # ignorados por Git). Sin ellos el build de Next muere con
      # `Module not found` en el layout de región — y así murió este job en
      # `056b49f` y `c2f861e`, con `pnpm verify` verde en los dos, porque
      # verify sí pasa por turbo y turbo respeta `dependsOn: ["^build"]`.
      # `src/deploy/ci-build-contract.test.ts` lo vigila desde aquí.
      - name: Build
        run: pnpm turbo run build --filter=@courvia/web

      # `playwright.config.ts` monta antes el escenario del recorrido con
      # `seed:e2e-operator` (globalSetup). Ese script crea un usuario con
      # contraseña fija y SOLO corre contra Postgres local o el desechable de
      # CI: aquí cumple las dos condiciones (DATABASE_URL a localhost y
      # CI=true), y contra cualquier otra base de datos se niega.
      - name: Browser suite
        run: pnpm e2e

      - name: Upload the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/test-results/
          retention-days: 7
