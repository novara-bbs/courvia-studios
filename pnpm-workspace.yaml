packages:
  - apps/*
  - packages/*
allowBuilds:
  # esbuild's postinstall selects the platform binary; required by tsx
  esbuild: true
  # Native watcher/compiler used by Payload's admin tooling; prebuilt binaries.
  '@parcel/watcher': true
  '@swc/core': true
# Supply-chain guard: refuse versions younger than 3 days at resolution time
# (frozen-lockfile installs in CI are unaffected). Exceptions live in
# minimumReleaseAgeExclude below.
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.10.11'
  - '@turbo/darwin-arm64@2.10.11'
  - '@turbo/linux-64@2.10.11'
  - '@turbo/linux-arm64@2.10.11'
  - '@turbo/windows-64@2.10.11'
  - '@turbo/windows-arm64@2.10.11'
  - '@vitest/expect@4.1.11'
  - '@vitest/mocker@4.1.11'
  - '@vitest/pretty-format@4.1.11'
  - '@vitest/runner@4.1.11'
  - '@vitest/snapshot@4.1.11'
  - '@vitest/spy@4.1.11'
  - '@vitest/utils@4.1.11'
  - turbo@2.10.11
  - vitest@4.1.11
